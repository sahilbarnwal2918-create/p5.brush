<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e8ebf2">
  <meta name="color-scheme" content="light">
  <title>Brush Studio · p5.brush</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 <!-- ===== BS-INTRO HTML START ===== -->  <!-- Starts hidden. The script below reveals it, so if JavaScript fails the  
     overlay simply never appears and your app is untouched. -->  <div class="bs-intro" id="bs-intro" hidden aria-hidden="true">  
  <div class="bs-intro__stage">  
    <svg class="bs-intro__ribbon" viewBox="0 0 400 160" focusable="false">  
      <defs>  
        <linearGradient id="bs-intro-grad" x1="0" y1="0" x2="1" y2="0">  
          <stop offset="0"   stop-color="#2f45d0"/>  
          <stop offset=".25" stop-color="#6a4c93"/>  
          <stop offset=".5"  stop-color="#c97b84"/>  
          <stop offset=".75" stop-color="#f46036"/>  
          <stop offset="1"   stop-color="#f2b134"/>  
        </linearGradient>  
      </defs>  <!-- Five pigments laid down side by side, like a loaded flat brush -->  
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">  
    <path class="bs-intro__strand" pathLength="1" stroke-dashoffset="1.02" stroke="#2f45d0" stroke-width="9"  
          d="M-20 79 C40 14 92 6 140 54 S230 124 290 64 S370 4 420 44"/>  
    <path class="bs-intro__strand" pathLength="1" stroke-dashoffset="1.02" stroke="#6a4c93" stroke-width="10"  
          d="M-22 88 C40 22 90 14 142 62 S230 132 288 72 S372 12 420 54"/>  
    <path class="bs-intro__strand" pathLength="1" stroke-dashoffset="1.02" stroke="#c97b84" stroke-width="10.5"  
          d="M-20 95 C40 30 90 20 140 70 S230 140 290 80 S370 20 420 60"/>  
    <path class="bs-intro__strand" pathLength="1" stroke-dashoffset="1.02" stroke="#f46036" stroke-width="9.5"  
          d="M-24 104 C38 38 88 29 138 80 S232 148 292 88 S368 29 420 69"/>  
    <path class="bs-intro__strand" pathLength="1" stroke-dashoffset="1.02" stroke="#f2b134" stroke-width="8.5"  
          d="M-20 111 C42 46 92 36 140 86 S228 156 290 96 S372 36 420 77"/>  
  </g>  

  <!-- The paintbrush. Its tip sits at (0,0); the script moves it along the stroke. -->  
  <g class="bs-intro__brush">  
    <g class="bs-intro__brush-pos" transform="translate(-20 95) rotate(26) scale(1.05)">  
      <path d="M-5.5 -18 C-6.5 -9 -3.5 -2.5 0 0 C3.5 -2.5 6.5 -9 5.5 -18 Z" fill="url(#bs-intro-grad)"/>  
      <rect x="-6" y="-30" width="12" height="12" rx="1.5" fill="#c4c9d6"/>  
      <path d="M-6 -24 H6" stroke="#9aa1b3" stroke-width=".8"/>  
      <path d="M-4.6 -30 L-3 -84 Q0 -89 3 -84 L4.6 -30 Z" fill="#2b3350"/>  
    </g>  
  </g>  
</svg>

  </div>    <div class="bs-intro__title">Brush Studio</div>    <svg class="bs-intro__rule" viewBox="0 0 200 14" focusable="false">  
    <path pathLength="1" stroke-dashoffset="1.02" fill="none" stroke="#f46036" stroke-width="2.6" stroke-linecap="round"  
          d="M4 8 C30 2 52 13 82 7 S132 3 160 9 S186 9 196 5"/>  
  </svg>    <div class="bs-intro__credit">Created by Sahil Barnwal</div>  
</div>  <script>  
/* Brush Studio intro — runs once per page load.  
   The CSS above drives the fades, title, underline and credit.  
   This script only (1) starts the clock, (2) draws the brushstroke and moves  
   the brush along it, and (3) removes the overlay from the page at the end. */  
function bsIntroStart(el) {  
  if (!el) return;  
  
  var done = false, leaving = false, raf = 0, timer = 0;  
  
  function finish() {  
    if (done) return;  
    done = true;  
    cancelAnimationFrame(raf);  
    clearTimeout(timer);  
    if (el.parentNode) el.parentNode.removeChild(el);   // gone from the page and the accessibility tree  
  }  
  
  // Tap anywhere to skip: quick fade, then remove.  
  function skip() {  
    if (done || leaving) return;  
    leaving = true;  
    var o = window.getComputedStyle(el).opacity;  
    el.style.animation = 'none';  
    el.style.opacity = o;  
    void el.offsetWidth;  
    el.style.transition = 'opacity .25s ease';  
    el.style.opacity = '0';  
    timer = setTimeout(finish, 280);  
  }  
  
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;  
  // Skip entirely for reduced motion, or if the intro CSS didn't load (e.g. a stale cached style.css).  
  if (reduce || window.getComputedStyle(el).position !== 'fixed') { finish(); return; }  
  
  var strands = Array.prototype.slice.call(el.querySelectorAll('.bs-intro__strand'));  
  var brush = el.querySelector('.bs-intro__brush-pos');  
  var guide = strands[2] || strands[0];      // the brush follows the middle strand  
  var len = 0;  
  
  el.hidden = false;                         // reveal the overlay  
  el.classList.add('is-playing');            // start every CSS animation  
  var t0 = performance.now();                // …and our own clock, in the same moment  
  try { len = guide.getTotalLength(); } catch (e) { len = 0; }  
  
  el.addEventListener('pointerdown', skip);  
  el.addEventListener('animationend', function (e) {  
    if (e.target === el && e.animationName === 'bs-intro-fade') finish();  
  });  
  timer = setTimeout(finish, 4100);          // safety net  
  
  // Brushstroke: 0.5s → 1.5s, each pigment starting a hair after the last.  
  function ease(u) { return u < .5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u); }  
  
  function tick(now) {  
    var t = (now - t0) / 1000, lead = 0;  
  
    for (var i = 0; i < strands.length; i++) {  
      var start = .5 + i * .03;  
      var u = (t - start) / (1.5 - start);  
      u = u < 0 ? 0 : (u > 1 ? 1 : u);  
      var p = ease(u);  
      strands[i].setAttribute('stroke-dashoffset', (1.02 * (1 - p)).toFixed(4));  
      if (strands[i] === guide) lead = p;  
    }  
  
    if (brush && len) {  
      var d = len * lead;  
      var a = guide.getPointAtLength(Math.max(0, d - 2));  
      var b = guide.getPointAtLength(Math.min(len, d + 2));  
      var c = guide.getPointAtLength(d);  
      var dir = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;  
      var tremor = Math.sin(t * 11) * 1.6;   // a touch of hand wobble  
      brush.setAttribute('transform',  
        'translate(' + c.x.toFixed(2) + ' ' + c.y.toFixed(2) + ') ' +  
        'rotate(' + (26 + dir * .3 + tremor).toFixed(2) + ') scale(1.05)');  
    }  
  
    if (t < 1.6) raf = requestAnimationFrame(tick);  
  }  
  raf = requestAnimationFrame(tick);  
}  
  
bsIntroStart(document.getElementById('bs-intro'));  
</script>  <!-- ===== BS-INTRO HTML END ===== -->
  <header class="topbar">
    <h1>Brush Studio</h1>
    <div class="actions">
      <button type="button" id="undoBtn" class="btn" disabled>Undo</button>
      <button type="button" id="clearBtn" class="btn">Clear</button>
      <button type="button" id="saveBtn" class="btn btn-primary">Save PNG</button>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>

  <div id="stageWrap">
    <!-- p5 puts its WEBGL canvas here (moved in sketch.js). #preview is a thin
         2D guide line shown while your finger is down. -->
    <div id="stage">
      <canvas id="preview" width="720" height="960"></canvas>
    </div>
  </div>

  <section class="tray" aria-label="Drawing controls">

    <div class="tools" role="group" aria-label="Tool">
      <button type="button" class="tool" data-tool="draw" aria-pressed="true">Brush</button>
      <button type="button" class="tool" data-tool="water" aria-pressed="false">Watercolor</button>
      <button type="button" class="tool" data-tool="hatch" aria-pressed="false">Hatch</button>
    </div>

    <p id="hint" class="hint"></p>

    <!-- Brush picker (Brush tool) -->
    <div class="group" data-tools="draw">
      <div id="brushChips" class="chips" role="group" aria-label="Brush"></div>
    </div>

    <!-- Hatch pen picker (Hatch tool) -->
    <div class="group" data-tools="hatch">
      <div id="hatchChips" class="chips" role="group" aria-label="Hatch pen"></div>
    </div>

    <!-- Colour -->
    <div class="group colors">
      <input type="color" id="colorPicker" value="#2f2a26" aria-label="Colour">
      <div id="swatches" class="swatches" role="group" aria-label="Palette"></div>
    </div>

    <!-- Sliders -->
    <div class="sliders">
      <label class="slider" data-tools="draw hatch">
        <span>Size</span><output></output>
        <input type="range" data-key="size" min="0.3" max="5" step="0.1" value="1">
      </label>

      <label class="slider" data-tools="water">
        <span>Opacity</span><output></output>
        <input type="range" data-key="opacity" min="20" max="255" step="5" value="110">
      </label>
      <label class="slider" data-tools="water">
        <span>Bleed</span><output></output>
        <input type="range" data-key="bleed" min="0" max="1" step="0.05" value="0.3">
      </label>
      <label class="slider" data-tools="water">
        <span>Texture</span><output></output>
        <input type="range" data-key="texture" min="0" max="1" step="0.05" value="0.6">
      </label>

      <label class="slider" data-tools="hatch">
        <span>Spacing</span><output></output>
        <input type="range" data-key="spacing" min="4" max="40" step="1" value="10">
      </label>
      <label class="slider" data-tools="hatch">
        <span>Angle</span><output></output>
        <input type="range" data-key="angle" min="0" max="180" step="5" value="45">
      </label>
      <label class="slider" data-tools="hatch">
        <span>Roughness</span><output></output>
        <input type="range" data-key="rough" min="0" max="0.5" step="0.05" value="0">
      </label>
    </div>

    <div class="checks">
      <label class="check" data-tools="water">
        <input type="checkbox" data-key="flat"> Flat wash (no watercolor texture)
      </label>
      <label class="check" data-tools="hatch">
        <input type="checkbox" data-key="cross"> Cross-hatch
      </label>
      <label class="check" data-tools="hatch">
        <input type="checkbox" data-key="outline" checked> Outline
      </label>
    </div>
<div class="creator-credit">
  Created with ❤️ by <strong>Sahil Barnwal</strong>
</div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="banner">This app needs JavaScript enabled.</p></noscript>

  <!-- Order matters: p5 first, then p5.brush, then the sketch. -->
  <!-- p5.js 2.x (p5.brush's p5 build requires 2.x). -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.0/lib/p5.min.js"></script>
  <!-- p5.brush (p5 build) from your fork's dist/ folder, matching the README you forked. -->
  <script src="https://cdn.jsdelivr.net/gh/sahilbarnwal2918-create/p5.brush@main/dist/p5.brush.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
