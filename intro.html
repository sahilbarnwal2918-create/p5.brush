<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5ecd9">
  <title>Brush Studio · intro preview</title>

  <style>
    /* ================================================================
       PREVIEW PAGE ONLY — a stand-in for your real app, so you can see
       what the intro reveals. None of this goes into your site.
       ================================================================ */
    html, body { height: 100%; margin: 0; }
    .pv {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column;
      background: #e8ebf2; color: #1f2740;
      font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .pv-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
    .pv-title { font: italic 600 1.2rem/1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
    .pv-sheet {
      flex: 1; margin: 6px 14px 0; background: #f7f3ea;
      box-shadow: 0 1px 2px rgba(31,39,64,.18), 0 8px 24px rgba(31,39,64,.14);
    }
    .pv-tray { margin-top: 12px; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); background: #f8f9fc; border-radius: 18px 18px 0 0; }
    .pv-status { margin: 0 0 10px; color: #59627a; font-size: .9rem; }
    .pv-btn {
      min-height: 44px; padding: 0 18px; border: 0; border-radius: 10px;
      background: #2f45d0; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }

    /* ===== BS-INTRO CSS START ===== */
    /* Brush Studio opening animation. Every name starts with "bs-intro" so it
       can never clash with your app's styles. Total length: 4.0 seconds. */

    .bs-intro {
      --bsi-cream: #f5ecd9;
      --bsi-ink: #1f2740;
      --bsi-graphite: #59627a;
      --bsi-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --bsi-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 2.4vh, 20px);
      padding: calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));
      overflow: hidden;
      opacity: 0;                         /* the animation fades it in */
      color: var(--bsi-ink);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;

      /* Warm cream paper, made only from CSS gradients: soft light in the
         middle, a warm shade at the bottom, and a very fine fibre grain. */
      background:
        radial-gradient(ellipse 90% 70% at 50% 38%, rgba(255, 252, 244, .75), rgba(255, 252, 244, 0) 70%),
        radial-gradient(ellipse 120% 90% at 50% 120%, rgba(176, 132, 76, .16), rgba(176, 132, 76, 0) 60%),
        repeating-linear-gradient(35deg, rgba(110, 80, 40, .028) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(-58deg, rgba(255, 255, 255, .16) 0 1px, transparent 1px 7px),
        var(--bsi-cream);
    }

    .bs-intro[hidden] { display: none !important; }

    /* Master clock: 4 seconds. 0.5s = 12.5%, 1.5s = 37.5%, 2.5s = 62.5%, 3.2s = 80%. */
    .bs-intro.is-playing { animation: bs-intro-fade 4s linear forwards; }

    .bs-intro__stage { width: 100%; max-width: 1100px; }

    .bs-intro__ribbon {
      display: block;
      width: 100%;
      height: auto;
      max-height: 40vh;                   /* keeps landscape phones tidy */
      overflow: visible;                  /* the stroke enters from beyond the edges */
    }

    .bs-intro__strand {
      stroke-dasharray: 1 3;              /* with pathLength="1": "draw" = animate dashoffset */
      opacity: .95;
    }

    .bs-intro__brush { opacity: 0; }

    .bs-intro__title {
      font: italic 600 clamp(2.4rem, min(10.5vw, 13vh), 4.6rem)/1.05 var(--bsi-serif);
      letter-spacing: -.01em;
      text-align: center;
      padding: .05em .12em .12em;
      opacity: 0;

      /* Left-to-right wipe, like ink being laid down. If a browser lacks
         mask support the text still fades in normally. */
      -webkit-mask-image: linear-gradient(90deg, #000 0 38%, transparent 56%);
      mask-image: linear-gradient(90deg, #000 0 38%, transparent 56%);
      -webkit-mask-size: 300% 100%;
      mask-size: 300% 100%;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: 100% 0;
      mask-position: 100% 0;
    }

    .bs-intro__rule {
      display: block;
      width: min(46%, 220px);
      height: auto;
      overflow: visible;
    }
    .bs-intro__rule path { stroke-dasharray: 1 3; }

    .bs-intro__credit {
      font: 400 clamp(.82rem, 3.5vw, 1rem)/1.3 var(--bsi-sans);
      letter-spacing: .07em;
      color: var(--bsi-graphite);
      text-align: center;
      opacity: 0;
    }

    /* ---- Timeline ---- */
    .bs-intro.is-playing .bs-intro__brush  { animation: bs-intro-brush  4s linear both; }
    .bs-intro.is-playing .bs-intro__title  { animation: bs-intro-title  4s cubic-bezier(.4, 0, .2, 1) both; }
    .bs-intro.is-playing .bs-intro__rule path { animation: bs-intro-rule 4s cubic-bezier(.3, 0, .2, 1) both; }
    .bs-intro.is-playing .bs-intro__credit { animation: bs-intro-credit 4s cubic-bezier(.4, 0, .2, 1) both; }

    /* 0.0–0.5s background fades in · 3.2–4.0s everything fades out.
       At the very end it becomes visibility:hidden, so it can never catch a tap. */
    @keyframes bs-intro-fade {
      0%    { opacity: 0; visibility: visible; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
      12.5% { opacity: 1; animation-timing-function: linear; }
      80%   { opacity: 1; visibility: visible; animation-timing-function: cubic-bezier(.4, 0, .2, 1); }
      100%  { opacity: 0; visibility: hidden; }
    }

    /* 0.5–1.5s the brush is on the page (its position is set by the script) */
    @keyframes bs-intro-brush {
      0%, 12.5% { opacity: 0; }
      15%, 37.5% { opacity: 1; }
      43.75%, 100% { opacity: 0; }
    }

    /* 1.5–2.5s the title is revealed */
    @keyframes bs-intro-title {
      0%, 37.5% {
        opacity: 0; transform: translateY(10px);
        -webkit-mask-position: 100% 0; mask-position: 100% 0;
      }
      62.5%, 100% {
        opacity: 1; transform: none;
        -webkit-mask-position: 0 0; mask-position: 0 0;
      }
    }

    /* 1.9–2.5s the hand-drawn underline */
    @keyframes bs-intro-rule {
      0%, 47.5% { stroke-dashoffset: 1.02; }
      62.5%, 100% { stroke-dashoffset: 0; }
    }

    /* 2.5–3.2s the credit */
    @keyframes bs-intro-credit {
      0%, 62.5% { opacity: 0; transform: translateY(6px); }
      80%, 100% { opacity: 1; transform: none; }
    }

    /* Accessibility: if the person asks for less motion, don't show it at all. */
    @media (prefers-reduced-motion: reduce) {
      .bs-intro { display: none !important; }
    }
    /* ===== BS-INTRO CSS END ===== */
  </style>
</head>

<body>

<!-- ===== BS-INTRO HTML START ===== -->
<!-- Starts hidden. The script below reveals it, so if JavaScript fails the
     overlay simply never appears and your app is untouched. -->
<div class="bs-intro" id="bs-intro" hidden aria-hidden="true">
  <div class="bs-intro__stage">
    <svg class="bs-intro__ribbon" viewBox="0 0 400 160" focusable="false">
      <defs>
        <linearGradient id="bs-intro-grad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"   stop-color="#2f45d0"/>
          <stop offset=".25" stop-color="#6a4c93"/>
          <stop offset=".5"  stop-color="#c97b84"/>
          <stop offset=".75" stop-color="#f46036"/>
          <stop offset="1"   stop-color="#f2b134"/>
        </linearGradient>
      </defs>

      <!-- Five pigments laid down side by side, like a loaded flat brush -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path class="bs-intro__strand" pathLength="1" stroke-dashoffset="1.02" stroke="#2f45d0" stroke-width="9"
              d="M-20 79 C40 14 92 6 140 54 S230 124 290 64 S370 4 420 44"/>
        <path class="bs-intro__strand" pathLength="1" stroke-dashoffset="1.02" stroke="#6a4c93" stroke-width="10"
              d="M-22 88 C40 22 90 14 142 62 S230 132 288 72 S372 12 420 54"/>
        <path class="bs-intro__strand" pathLength="1" stroke-dashoffset="1.02" stroke="#c97b84" stroke-width="10.5"
              d="M-20 95 C40 30 90 20 140 70 S230 140 290 80 S370 20 420 60"/>
        <path class="bs-intro__strand" pathLength="1" stroke-dashoffset="1.02" stroke="#f46036" stroke-width="9.5"
              d="M-24 104 C38 38 88 29 138 80 S232 148 292 88 S368 29 420 69"/>
        <path class="bs-intro__strand" pathLength="1" stroke-dashoffset="1.02" stroke="#f2b134" stroke-width="8.5"
              d="M-20 111 C42 46 92 36 140 86 S228 156 290 96 S372 36 420 77"/>
      </g>

      <!-- The paintbrush. Its tip sits at (0,0); the script moves it along the stroke. -->
      <g class="bs-intro__brush">
        <g class="bs-intro__brush-pos" transform="translate(-20 95) rotate(26) scale(1.05)">
          <path d="M-5.5 -18 C-6.5 -9 -3.5 -2.5 0 0 C3.5 -2.5 6.5 -9 5.5 -18 Z" fill="url(#bs-intro-grad)"/>
          <rect x="-6" y="-30" width="12" height="12" rx="1.5" fill="#c4c9d6"/>
          <path d="M-6 -24 H6" stroke="#9aa1b3" stroke-width=".8"/>
          <path d="M-4.6 -30 L-3 -84 Q0 -89 3 -84 L4.6 -30 Z" fill="#2b3350"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="bs-intro__title">Brush Studio</div>

  <svg class="bs-intro__rule" viewBox="0 0 200 14" focusable="false">
    <path pathLength="1" stroke-dashoffset="1.02" fill="none" stroke="#f46036" stroke-width="2.6" stroke-linecap="round"
          d="M4 8 C30 2 52 13 82 7 S132 3 160 9 S186 9 196 5"/>
  </svg>

  <div class="bs-intro__credit">Created by Sahil Barnwal</div>
</div>

<script>
/* Brush Studio intro — runs once per page load.
   The CSS above drives the fades, title, underline and credit.
   This script only (1) starts the clock, (2) draws the brushstroke and moves
   the brush along it, and (3) removes the overlay from the page at the end. */
function bsIntroStart(el) {
  if (!el) return;

  var done = false, leaving = false, raf = 0, timer = 0;

  function finish() {
    if (done) return;
    done = true;
    cancelAnimationFrame(raf);
    clearTimeout(timer);
    if (el.parentNode) el.parentNode.removeChild(el);   // gone from the page and the accessibility tree
  }

  // Tap anywhere to skip: quick fade, then remove.
  function skip() {
    if (done || leaving) return;
    leaving = true;
    var o = window.getComputedStyle(el).opacity;
    el.style.animation = 'none';
    el.style.opacity = o;
    void el.offsetWidth;
    el.style.transition = 'opacity .25s ease';
    el.style.opacity = '0';
    timer = setTimeout(finish, 280);
  }

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Skip entirely for reduced motion, or if the intro CSS didn't load (e.g. a stale cached style.css).
  if (reduce || window.getComputedStyle(el).position !== 'fixed') { finish(); return; }

  var strands = Array.prototype.slice.call(el.querySelectorAll('.bs-intro__strand'));
  var brush = el.querySelector('.bs-intro__brush-pos');
  var guide = strands[2] || strands[0];      // the brush follows the middle strand
  var len = 0;

  el.hidden = false;                         // reveal the overlay
  el.classList.add('is-playing');            // start every CSS animation
  var t0 = performance.now();                // …and our own clock, in the same moment
  try { len = guide.getTotalLength(); } catch (e) { len = 0; }

  el.addEventListener('pointerdown', skip);
  el.addEventListener('animationend', function (e) {
    if (e.target === el && e.animationName === 'bs-intro-fade') finish();
  });
  timer = setTimeout(finish, 4100);          // safety net

  // Brushstroke: 0.5s → 1.5s, each pigment starting a hair after the last.
  function ease(u) { return u < .5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u); }

  function tick(now) {
    var t = (now - t0) / 1000, lead = 0;

    for (var i = 0; i < strands.length; i++) {
      var start = .5 + i * .03;
      var u = (t - start) / (1.5 - start);
      u = u < 0 ? 0 : (u > 1 ? 1 : u);
      var p = ease(u);
      strands[i].setAttribute('stroke-dashoffset', (1.02 * (1 - p)).toFixed(4));
      if (strands[i] === guide) lead = p;
    }

    if (brush && len) {
      var d = len * lead;
      var a = guide.getPointAtLength(Math.max(0, d - 2));
      var b = guide.getPointAtLength(Math.min(len, d + 2));
      var c = guide.getPointAtLength(d);
      var dir = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      var tremor = Math.sin(t * 11) * 1.6;   // a touch of hand wobble
      brush.setAttribute('transform',
        'translate(' + c.x.toFixed(2) + ' ' + c.y.toFixed(2) + ') ' +
        'rotate(' + (26 + dir * .3 + tremor).toFixed(2) + ') scale(1.05)');
    }

    if (t < 1.6) raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);
}

bsIntroStart(document.getElementById('bs-intro'));
</script>
<!-- ===== BS-INTRO HTML END ===== -->


<!-- ================= PREVIEW PAGE ONLY (not part of the integration) ================= -->
<div class="pv">
  <div class="pv-top"><span class="pv-title">Brush Studio</span></div>
  <div class="pv-sheet"></div>
  <div class="pv-tray">
    <p class="pv-status" id="pv-status" role="status">Playing…</p>
    <button type="button" class="pv-btn" id="pv-replay">Replay intro</button>
  </div>
</div>

<script>
(function () {
  var status = document.getElementById('pv-status');
  var start = performance.now();
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduce) {
    status.textContent = 'Reduced motion is turned on, so the intro is skipped. This is intentional.';
  } else {
    var iv = setInterval(function () {
      if (!document.getElementById('bs-intro')) {
        clearInterval(iv);
        status.textContent = 'Intro finished after ' + ((performance.now() - start) / 1000).toFixed(1) +
                             ' s and was removed from the page. Your app is fully usable.';
      }
    }, 100);
  }
  document.getElementById('pv-replay').addEventListener('click', function () { location.reload(); });
})();
</script>

</body>
</html>
